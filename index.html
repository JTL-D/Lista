<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <title>Excel Loader Validator Preview — Raw Untouched, Final Processed — Horizontal Scroll (No Preview Buttons)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { --bg:#f7f7f7; --card:#fff; --accent:#4CAF50; --err:#f44336; --btn:#1976d2; --btn-fg:#fff; }
    body { font-family: Arial, Helvetica, sans-serif; margin: 1.2rem; background: var(--bg); color:#222 }
    h1 { text-align:center; margin-bottom:0.6rem }
    .grid { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; margin-bottom:0.6rem }
    .upload-box { border:2px dashed #aaa; background:var(--card); padding:0.8rem; width:280px; text-align:center; position:relative; cursor:pointer; transition:background .2s, border-color .2s; }
    .upload-box.loaded { background:#e9fff0; border-color:var(--accent) }
    .upload-box.error { background:#fff0f0; border-color:var(--err) }
    .upload-box input { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer }
    .hint { font-size:0.85rem; color:#555; margin-top:0.35rem }
    .file-name { margin-top:0.4rem; font-size:0.85rem; word-break:break-all }
    #controls { display:flex; gap:0.5rem; justify-content:center; margin-bottom:0.6rem; flex-wrap:wrap }
    button { padding:8px 10px; font-size:13px; cursor:pointer; border-radius:4px; border:none; background:var(--btn); color:var(--btn-fg) }
    button.ghost { background:transparent; color:var(--btn); border:1px solid var(--btn) }
    #previewFinalWrap { position:relative; margin-bottom:1rem; }
    .h-scroll { overflow:auto; white-space:nowrap; border:1px solid #ddd; background:var(--card); padding:0.5rem; }
    .h-scroll > .sheet-block { display:inline-block; vertical-align:top; white-space:normal; margin-right:12px; min-width:640px; } 
    table { border-collapse:collapse; margin-top:0.2rem; overflow:auto; display:table; min-width: max-content; }
    th, td { border:1px solid #ccc; padding:6px; text-align:left; vertical-align:top; background:transparent }
    .sheet-block { border:1px solid #eee; padding:8px; border-radius:6px; background:#fff }
    .sheet-title { font-weight:700; margin:0 0 6px 0; display:flex; gap:8px; align-items:center }
  .scroll-btn { width:36px; height:36px; border-radius:18px; background:rgba(0,0,0,0.6); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:10; margin:0 8px; box-shadow:0 2px 8px rgba(0,0,0,0.12); }
    #finalScrollBtnsWrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 0;
      pointer-events: none;
      z-index: 20;
    }
    #finalScrollLeft, #finalScrollRight {
      position: absolute;
      top: 0;
      pointer-events: auto;
    }
    #finalScrollLeft {
      left: 8px;
      /* μπλε κύκλος: λίγο μέσα από το αριστερό άκρο του preview */
    }
    #finalScrollRight {
      right: 8px;
      /* κόκκινος κύκλος: λίγο μέσα από το δεξί άκρο του preview */
    }
  #finalScrollBtnsWrap .scroll-btn { pointer-events:auto; }
    .preview-label { position:absolute; left:50%; transform:translateX(-50%); top:8px; font-weight:600; color:#333; background:transparent; z-index:5 }
    .meta { font-size:0.85rem; color:#666 }
    .note { font-size:0.9rem; color:#333; text-align:center }
    .topbar { display:flex; gap:1rem; justify-content:center; margin-top:0.45rem }
    .small { font-size:0.85rem; color:#444 }
    .status { font-size:0.9rem; color:#006; margin-left:8px }
    .busy { color:#f39c12 }
    @media (max-width:800px) {
      .h-scroll > .sheet-block { min-width:480px }
      table { font-size:13px }
    }
  </style>
</head>
<body>
  <h1>Πελάτες & Πρακτορεία Ημέρας</h1>

  <div class="grid" role="region" aria-label="upload controls">
    <div id="masterDrop" class="upload-box" title="Εισάγετε EXCEL με πελάτες Ημέρας">
      <strong>Εισάγετε EXCEL με πελάτες Ημέρας</strong>
      <div class="hint">Υποχρεωτικές στήλες: <strong>Κωδ.Πελάτη</strong>, <strong>Συνεργάτης</strong>, <strong>Οδός</strong></div>
      <input id="masterInput" type="file" accept=".xlsx,.xls" />
      <div class="file-name" id="masterFileName"></div>
    </div>

    <div id="infoDrop" class="upload-box" title="Εισάγετε το INFO EXCEL">
      <strong>Εισάγετε το INFO EXCEL</strong>
      <div class="hint">Απαιτείται όνομα αρχείου: <strong>INFO.xlsx</strong> ή <strong>INFO.xls</strong></div>
      <input id="infoInput" type="file" accept=".xlsx,.xls" />
      <div class="file-name" id="infoFileName"></div>
    </div>
  </div>

  <div id="controls">
    <button id="btnClear" class="ghost">Clear</button>
    <span class="status" id="opStatus"></span>
  </div>

  <div id="previewFinalWrap">
    <div class="preview-label">Preview Final (processed)</div>
    <div id="previewFinal" class="h-scroll" aria-live="polite" role="region" aria-label="preview final"></div>
  </div>

  <div class="topbar" style="margin-top:0.6rem">
    <div class="small">Βιβλιοθήκη: <strong>exceljs</strong> (browser)</div>
  </div>

  <div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);align-items:center;justify-content:center;z-index:99999;">
    <div style="background:#fff;padding:1rem;border-radius:6px;max-width:520px;margin:auto;opacity:1;">
      <h3 id="modalTitle">Προειδοποίηση</h3>
      <div id="modalBody" class="meta"></div>
      <div style="text-align:right;margin-top:0.6rem"><button id="modalOk" class="ghost">ΟΚ</button></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script>
    // --- Utility: normalize for codes, partners, streets (NFD, remove diacritics, spaces, lowercase) ---
    function normalize(val) {
      return (val || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '').toLowerCase();
    }
    function toPlainString(v) {
      if (v === undefined || v === null) return '';
      if (typeof v === 'string') {
        return /\[object Object]/i.test(v) ? '' : v;
      }
      try {
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'object') {
          if (Array.isArray(v.richText)) return v.richText.map(p => p.text).join('');
          if ('text' in v && v.text !== undefined && v.text !== null) return String(v.text);
          if ('result' in v && v.result !== undefined && v.result !== null) return String(v.result);
          if ('value' in v && v.value !== undefined && v.value !== null) return toPlainString(v.value);
          if (Array.isArray(v)) return v.map(toPlainString).join('');
          for (const key in v) {
            if (!Object.prototype.hasOwnProperty.call(v, key)) continue;
            const inner = v[key];
            if (inner === undefined || inner === null) continue;
            if (typeof inner === 'string' && inner.trim() !== '') return inner;
            if (typeof inner === 'number') return String(inner);
            if (Array.isArray(inner.richText)) return inner.richText.map(r => r.text).join('');
          }
          try { return JSON.stringify(v); } catch (err) { return ''; }
        }
      } catch (e) {
        return '';
      }
      return '';
    }

    const state = {
      files: { master: null, info: null },
      context: { workbookMaster: null, workbookInfo: null, processedMaster: null },
      visibleRows: new Map(),
      autoProcessing: false
    };

    const masterInput = document.getElementById('masterInput');
    const infoInput = document.getElementById('infoInput');
    const masterDrop = document.getElementById('masterDrop');
    const infoDrop = document.getElementById('infoDrop');
    const masterFileName = document.getElementById('masterFileName');
    const infoFileName = document.getElementById('infoFileName');
    const previewFinal = document.getElementById('previewFinal');
    const previewFinalWrap = document.getElementById('previewFinalWrap');
    const btnClear = document.getElementById('btnClear');
    const opStatus = document.getElementById('opStatus');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalOk = document.getElementById('modalOk');

    const requiredCols = ['Κωδ.Πελάτη','Συνεργάτης','Οδός'];
    const RAW_INITIAL_ROWS = 100;
    const RAW_STEP_ROWS = 100;
    const RAW_MAX_COLS = 80;
    const FINAL_INITIAL_ROWS = 500;
    const FINAL_MAX_COLS = 80;
    const SCROLL_STEP_PX = 400;
    const SCROLL_SMOOTH = true;

    function showModal(title, html) {
      modalTitle.textContent = title;
      modalBody.innerHTML = html;
      modal.style.display = 'flex';
    }
    function hideModal() { modal.style.display = 'none'; }
    modalOk.addEventListener('click', hideModal);

    function getExt(file) { const idx = file.name.lastIndexOf('.'); return idx>-1 ? file.name.slice(idx+1).toLowerCase() : ''; }
    function getBaseName(file) { const idx = file.name.lastIndexOf('.'); return idx>-1 ? file.name.slice(0,idx) : file.name; }
    function isValidExcel(file) { const ext = getExt(file); return ext==='xlsx' || ext==='xls'; }
    function setStatus(txt, busy=false) {
      opStatus.textContent = txt;
      opStatus.classList.toggle('busy', !!busy);
      if (!busy) setTimeout(()=>{ if (opStatus.textContent === txt) opStatus.textContent=''; }, 4000);
    }
    function clearBoxUI(box) {
      box.classList.remove('error','loaded');
      if (box===masterDrop) masterFileName.textContent='';
      if (box===infoDrop) infoFileName.textContent='';
      previewFinal.innerHTML = `<p class="note">Το παράθυρο <strong>Preview Final</strong> θα εμφανιστεί αυτόματα μετά το φορτωμα και το auto-clean.</p>`;
      state.visibleRows.clear();
    }

    function argbToHex(argb) { return '#' + (argb || '').slice(2); }
    function colLetterToNumber(str) {
      let num = 0;
      for (let ch of (str || '')) num = num * 26 + (ch.charCodeAt(0) - 64);
      return num;
    }
    function getExcelValueType(name, fallback) {
      const vt = window.ExcelJS && window.ExcelJS.ValueType;
      if (vt && Object.prototype.hasOwnProperty.call(vt, name) && typeof vt[name] === 'number') {
        return vt[name];
      }
      return fallback;
    }
    // Defensive helpers for Excel corruption cases
    function sanitizeWorkbookStyles(workbook) {
      try {
        if (!workbook || !workbook.styles || !workbook.styles.model || !workbook.styles.model.cellXfs) return;
        const xf = workbook.styles.model.cellXfs;
        const xfCount = Array.isArray(xf) ? xf.length : (xf.count || 0);
        if (!xfCount) return;
        const maxIndex = xfCount - 1;
        workbook.eachSheet(sheet => {
          sheet.eachRow(row => {
            row.eachCell(cell => {
              if (!cell) return;
              const styleId = (cell.style && typeof cell.styleId === 'number') ? cell.styleId : (typeof cell.style === 'number' ? cell.style : undefined);
              if (typeof styleId === 'number' && styleId > maxIndex) {
                console.warn('[SANITIZE] cell styleId out of range, resetting', { sheet: sheet.name, row: row.number, col: cell.col, styleId: cell.styleId, maxIndex });
                cell.styleId = 0;
              }
              if (cell.numFmt && typeof cell.numFmt === 'number' && cell.numFmt > maxIndex) cell.numFmt = '@';
            });
          });
        });
      } catch (err) {
        console.error('[SANITIZE] sanitizeWorkbookStyles failed', err);
      }
    }
    function sanitizeWorkbookFonts(workbook) {
      try {
        const fontArrays = [];
        const stylesModelFonts = workbook && workbook.styles && workbook.styles.model && Array.isArray(workbook.styles.model.fonts)
          ? workbook.styles.model.fonts
          : null;
        if (stylesModelFonts) fontArrays.push(stylesModelFonts);

        const modelFonts = workbook && workbook.model && workbook.model.styles && Array.isArray(workbook.model.styles.fonts)
          ? workbook.model.styles.fonts
          : null;
        if (modelFonts && modelFonts !== stylesModelFonts) fontArrays.push(modelFonts);

        if (!fontArrays.length) return;

        const normalizeName = (font) => {
          if (!font) return '';
          const raw = font.name;
          if (typeof raw === 'string') return raw.trim();
          if (raw && typeof raw === 'object') {
            if (typeof raw.name === 'string') return raw.name.trim();
            if (typeof raw.val === 'string') return raw.val.trim();
            if (typeof raw.text === 'string') return raw.text.trim();
          }
          if (typeof font.familyname === 'string') return font.familyname.trim();
          return '';
        };

        const normalizeSize = (font) => {
          if (!font) return null;
          if (typeof font.size === 'number') return font.size;
          if (font.size && typeof font.size === 'object') {
            if (typeof font.size.size === 'number') return font.size.size;
            if (typeof font.size.val === 'number') return font.size.val;
            if (typeof font.size.value === 'number') return font.size.value;
          }
          if (typeof font.sz === 'number') return font.sz;
          if (font.sz && typeof font.sz === 'object') {
            if (typeof font.sz.val === 'number') return font.sz.val;
            if (typeof font.sz.value === 'number') return font.sz.value;
          }
          if (typeof font.fontSize === 'number') return font.fontSize;
          const parsed = Number(font.size);
          if (Number.isFinite(parsed)) return parsed;
          return null;
        };

        const ensureFontShape = (font) => {
          if (!font || typeof font !== 'object') return {
            name: 'Calibri',
            family: 2,
            size: 11,
            color: { theme: 1 },
            scheme: 'minor'
          };

          const safeFont = font;

          let safeName = normalizeName(safeFont);
          if (!safeName) safeName = 'Calibri';
          safeFont.name = safeName;

          let safeSize = normalizeSize(safeFont);
          if (safeSize == null || !Number.isFinite(safeSize) || safeSize <= 0) safeSize = 11;
          safeFont.size = safeSize;

          if (safeFont.sz !== undefined) delete safeFont.sz;
          if (safeFont.fontSize !== undefined) delete safeFont.fontSize;

          if (typeof safeFont.family !== 'number' || safeFont.family <= 0) safeFont.family = 2;
          if (!safeFont.color || typeof safeFont.color !== 'object') safeFont.color = { theme: 1 };
          if (!safeFont.scheme) safeFont.scheme = 'minor';

          return safeFont;
        };

        for (const fonts of fontArrays) {
          if (!fonts.length) {
            fonts.push({ name: 'Calibri', family: 2, size: 11, color: { theme: 1 }, scheme: 'minor' });
            continue;
          }
          for (let i = 0; i < fonts.length; i++) {
            fonts[i] = ensureFontShape(fonts[i]);
          }
          fonts[0] = ensureFontShape(fonts[0]);
        }
      } catch (err) {
        console.error('[SANITIZE] sanitizeWorkbookFonts failed', err);
      }
    }
    function sanitizeSharedStrings(workbook) {
      try {
        if (!workbook || !workbook.sharedStrings || !Array.isArray(workbook.sharedStrings.values)) return;
        const values = workbook.sharedStrings.values;
        const maxIndex = values.length - 1;
        const sharedStringType = getExcelValueType('SharedString', 7);
        workbook.eachSheet(sheet => {
          sheet.eachRow(row => {
            row.eachCell(cell => {
              if (cell && cell.type === sharedStringType) {
                const idx = typeof cell.value === 'number' ? cell.value : cell.value && cell.value.id;
                if (typeof idx === 'number' && (idx < 0 || idx > maxIndex)) {
                  console.warn('[SANITIZE] sharedString index out of range, converting to inline string', { sheet: sheet.name, row: row.number, col: cell.col, idx, maxIndex });
                  const text = toPlainString(cell.text || cell.value);
                  cell.value = text || '';
                }
              }
            });
          });
        });
      } catch (err) {
        console.error('[SANITIZE] sanitizeSharedStrings failed', err);
      }
    }
    function sanitizeWorksheetDimensions(sheet) {
      if (!sheet) return;
      try {
        const { dimension } = sheet;
        if (!dimension || !dimension.model) return;
        const dimRef = dimension.model.ref;
        if (!dimRef) return;
        const [startRef, endRef] = dimRef.split(':');
        if (!endRef) return;
        const endColLetters = endRef.replace(/\d+/g, '') || 'A';
        const endRowDigits = Number(endRef.replace(/[^\d]/g, '')) || sheet.rowCount;
        let maxCol = colLetterToNumber(endColLetters);
        let maxRow = endRowDigits;
        sheet.eachRow(row => {
          maxRow = Math.max(maxRow, row.number);
          row.eachCell({ includeEmpty: false }, cell => {
            maxCol = Math.max(maxCol, cell.col);
          });
        });
        const newRef = `A1:${columnNumberToLetter(Math.max(1, maxCol))}${Math.max(1, maxRow)}`;
        if (newRef !== dimRef) {
          console.warn('[SANITIZE] adjusting worksheet dimension', { sheet: sheet.name, from: dimRef, to: newRef });
          sheet.model.dimension.ref = newRef;
        }
      } catch (err) {
        console.error('[SANITIZE] sanitizeWorksheetDimensions failed', err);
      }
    }
    function columnNumberToLetter(num) {
      let col = '';
      num = Math.max(1, Math.floor(num));
      while (num > 0) {
        const rem = (num - 1) % 26;
        col = String.fromCharCode(65 + rem) + col;
        num = Math.floor((num - 1) / 26);
      }
      return col || 'A';
    }
    function sanitizeCellFont(cell) {
      if (!cell || !cell.font) return;
      const font = cell.font;
      if (!font.name || typeof font.name !== 'string' || !font.name.trim()) {
        font.name = 'Segoe UI';
      }
      if (font.size && typeof font.size !== 'number') {
        const parsed = Number(font.size);
        font.size = Number.isFinite(parsed) && parsed > 0 ? parsed : 11;
      }
      cell.font = { ...font, name: font.name, size: font.size || 11 };
    }
    function sanitizeWorksheetMergeCells(sheet) {
      if (!sheet || !Array.isArray(sheet._merges)) return;
      try {
        const validMerges = [];
        const colCount = sheet.columnCount || 0;
        const rowCount = sheet.rowCount || 0;
        for (const merge of sheet._merges) {
          if (!merge || !merge.top || !merge.left) continue;
          if (merge.left < 1 || merge.top < 1) continue;
          if ((colCount && merge.right > colCount) || (rowCount && merge.bottom > rowCount)) {
            console.warn('[SANITIZE] dropping merge outside bounds', { sheet: sheet.name, merge, colCount, rowCount });
            continue;
          }
          validMerges.push(merge);
        }
        if (validMerges.length !== sheet._merges.length) {
          sheet._merges = validMerges;
        }
      } catch (err) {
        console.error('[SANITIZE] sanitizeWorksheetMergeCells failed', err);
      }
    }
    function parseCellRef(ref) {
      if (!ref) return null;
      const colLetters = ref.replace(/\d+/g, '');
      const rowDigits = ref.replace(/[^\d]/g, '');
      if (!colLetters || !rowDigits) return null;
      return { col: colLetterToNumber(colLetters), row: Number(rowDigits) };
    }
    function sanitizeWorksheetHyperlinks(sheet) {
      if (!sheet || !sheet.model || !Array.isArray(sheet.model.hyperlinks) || !sheet.model.hyperlinks.length) return;
      try {
        const dim = sheet && sheet.model && sheet.model.dimension ? sheet.model.dimension.ref : null;
        let maxCol = sheet.columnCount || 0;
        let maxRow = sheet.rowCount || 0;
        if (dim) {
          const [, endRef] = dim.split(':');
          if (endRef) {
            const parsed = parseCellRef(endRef);
            if (parsed) {
              maxCol = Math.max(maxCol, parsed.col);
              maxRow = Math.max(maxRow, parsed.row);
            }
          }
        }
        const valid = [];
        for (const link of sheet.model.hyperlinks) {
          if (!link || !link.ref) continue;
          const refs = link.ref.split(':');
          const cells = refs.map(parseCellRef).filter(Boolean);
          if (!cells.length) {
            console.warn('[SANITIZE] removing hyperlink with invalid ref', { sheet: sheet.name, link });
            continue;
          }
          const withinBounds = cells.every(({ col, row }) => col >= 1 && row >= 1 && (!maxCol || col <= maxCol) && (!maxRow || row <= maxRow));
          if (!withinBounds) {
            console.warn('[SANITIZE] removing hyperlink outside bounds', { sheet: sheet.name, link, maxCol, maxRow });
            continue;
          }
          valid.push(link);
        }
        sheet.model.hyperlinks = valid;
      } catch (err) {
        console.error('[SANITIZE] sanitizeWorksheetHyperlinks failed', err);
      }
    }
    function sanitizeWorksheetPageSetup(sheet) {
      if (!sheet || !sheet.pageSetup) return;
      const ps = sheet.pageSetup;
      const badValues = [undefined, null, '', 4294967295];
      const cleanup = key => {
        if (key in ps) {
          const val = ps[key];
          if (badValues.includes(val) || (typeof val === 'number' && (!Number.isFinite(val) || val <= 0))) {
            console.warn('[SANITIZE] removing invalid pageSetup value', { sheet: sheet.name, key, value: val });
            delete ps[key];
          }
        }
      };
      cleanup('horizontalDpi');
      cleanup('verticalDpi');
      if (!('header' in ps) || typeof ps.header !== 'number' || ps.header < 0) ps.header = 0.3;
      if (!('footer' in ps) || typeof ps.footer !== 'number' || ps.footer < 0) ps.footer = 0.3;
    }

    function normalizeHeaderLabel(lbl) {
      if (lbl === undefined || lbl === null) return '';
      return String(lbl).trim().replace(/\u00A0/g,' ').normalize();
    }

    async function processMasterToCopy(masterWb, infoWb) {
  // --- ΕΛΕΓΧΟΣ SPAR για ΜΕ BAZAAR ---
  // Declare praktoreiaSheet for use throughout
  let praktoreiaSheet = null;
      // SPAR lookup: δύο επίπεδα
      //   sparWildcardByCode       : κωδικός μόνο  → όλα τα υποκαταστήματα του πελάτη
      //   sparSpecificByCodeOdos   : κωδικός+οδός → μόνο η συγκεκριμένη γραμμή master
      // Priority at lookup: specific > wildcard
      // Strict error: duplicate keys με διαφορετική Περιοχή → alert + throw
      const DEBUG_SPAR = false;
      const sparSheet = infoWb.getWorksheet('SPAR');
      let sparWildcardByCode = new Map();
      let sparSpecificByCodeOdos = new Map();
      if (sparSheet) {
        if (DEBUG_SPAR) console.log('[SPAR] Βρέθηκε φύλλο SPAR rowCount:', sparSheet.rowCount);
        // Σάρωσε τις πρώτες 5 γραμμές για να βρεις header row με "Κωδ.Πελάτη" και "Περιοχή"
        let sparHeaderVals = [];
        let sparHeaderRowNum = -1;
        for (let r = 1; r <= Math.min(5, sparSheet.rowCount); r++) {
          let row = sparSheet.getRow(r);
          let vals = [];
          let foundCode = false, foundRegion = false;
          for (let c = 1; c <= Math.max(row.cellCount, 20); c++) {
            let cell = row.getCell(c);
            let val = toPlainString(cell && cell.value);
            if (!val) { vals.push(''); continue; }
            vals.push(val);
            if (val.replace(/\s/g, '').toLowerCase().includes('κωδ.πελάτη')) foundCode = true;
            if (val.replace(/\s/g, '').toLowerCase().includes('περιοχή')) foundRegion = true;
          }
          if (foundCode && foundRegion) {
            sparHeaderVals = vals;
            sparHeaderRowNum = r;
            break;
          }
        }
        // Βρες indexes των στηλών "Κωδ.Πελάτη", "Περιοχή", "Οδός"

        const startRow = sparHeaderRowNum > 0 ? sparHeaderRowNum + 1 : 2;
        for (let i = startRow; i <= sparSheet.rowCount; i++) {
          const row = sparSheet.getRow(i);

          const odos = idxSparOdos > -1 && row.getCell(idxSparOdos).value ? toPlainString(row.getCell(idxSparOdos).value).trim() : '';
          if (!code || !region) continue;
          const nCode = normalize(code);

      // --- ΕΛΕΓΧΟΣ ΣΥΓΚΡΟΥΣΕΩΝ SPAR ↔ TRANS ---

  // console.log('[DEBUG] Δεν βρέθηκε φύλλο RETAIL στο INFO.');
      }
      // Helper για normalization (trim, lowercase, χωρίς τόνους, χωρίς κενά)
            // --- MERGE ΚΑΘΕΤΑ ΟΠΩΣ ΖΗΤΗΘΗΚΕ ---

            function foldGreekToLatin(str) {
              if (!str) return '';
              let result = '';
              for (const ch of str) {
                result += greekToLatinMap[ch] !== undefined ? greekToLatinMap[ch] : ch;
              }
              return result;

            function normalizeBLHeaderName(val) {
              if (val === undefined || val === null) return '';
              let raw = val;
              if (typeof val === 'object') {
                if (Array.isArray(val.richText)) {
                  raw = val.richText.map(part => part.text).join('');
                } else if ('text' in val && val.text !== undefined && val.text !== null) {
                  raw = val.text;
                } else if ('result' in val && val.result !== undefined && val.result !== null) {
                  raw = val.result;
                } else if ('value' in val && val.value !== undefined && val.value !== null) {

              const base = str

                .replace(/ς/g, 'σ');
              const folded = foldGreekToLatin(base);
              return folded
                .replace(/[^a-z0-9]+/gi, '')
                .toLowerCase();

            // Global helper: robust plain-string extraction from various exceljs value shapes

              else {

            }

      // Δημιούργησε νέο workbook και φύλλα
      const ExcelJS = window.ExcelJS || (await import('exceljs'));
      const newWb = new ExcelJS.Workbook();
  const removedRowsLog = [];
  const odosOnlyLog = [];

      // Για κάθε φύλλο MASTER
      masterWb.worksheets.forEach((ws) => {
        // Βήμα 2: Unmerge όλα τα κελιά

        const rowsToKeep = [];

            const headerRowObj2 = praktoreiaSheet.addRow(praktoreiaHeader);

            // Εντοπισμός στήλης "Κωδ. Πελατη" (με normalization)

            // Εύρεση index στήλης 'Κωδ.Πελατη' στο πρακτορεία

            const centerHeaders2 = ['ΤΡ','Α','Β','ΕΛ','ΣΟΚ','Ψ','ΚΤΨ','+'].map(h => h.normalize('NFD').replace(/\p{Diacritic}/gu, '').replace(/\s+/g, '').toLowerCase());
            const praktSynergatisCol = idxSynergatis2 + 1;

            const praktGroupMap = new Map();

            const sortPraktEntriesByOdos = entries => {

                if (aOdos === bOdos) return a.originalIndex - b.originalIndex;
                if (!aOdos) return 1;
                if (!bOdos) return -1;
                return aOdos.localeCompare(bOdos);

              return entries;

            const praktGroupsWithRegion = [];

            const praktOrderedKeys = [...praktGroupsWithRegion, ...praktGroupsWithoutRegion];

            const praktTransportBuckets = new Map();

            const praktFinalGroupOrder = [];

              const transportKey = normalizeForGroupKey(sampleTransport);

                praktTransportBuckets.set(transportKey, []);
                praktTransportOrder.push(transportKey);

              praktTransportBuckets.get(transportKey).push({ key, entries });

            for (const transportKey of praktTransportOrder) {

            finalizePelatesSheet(praktFinalGroupOrder);

            function applyPraktoreiaVerticalMerges(sheet, headerValues) {
              if (!sheet || !Array.isArray(headerValues)) return;
              const headerNorms = headerValues.map(advNorm);
              const idxKod = headerNorms.findIndex(x => x === 'κωδ.πελατη');
              const idxOdos = headerNorms.findIndex(x => x.includes('οδο'));
              const idxPlus = headerNorms.findIndex(x => x === '+');
              if (idxKod === -1 || idxOdos === -1 || idxPlus === -1) return;
              const dataStart = 3; // 1=ημερομηνία, 2=κεφαλίδες
              const rowCount = sheet.rowCount;
              if (rowCount < dataStart) return;
              const groups = new Map();
              for (let r = dataStart; r <= rowCount; r++) {
                const row = sheet.getRow(r);
                let kodVal = row.getCell(idxKod + 1).value;
                let odosVal = row.getCell(idxOdos + 1).value;
                if (kodVal && typeof kodVal === 'object' && kodVal.richText) kodVal = kodVal.richText.map(pt => pt.text).join('');
                if (odosVal && typeof odosVal === 'object' && odosVal.richText) odosVal = odosVal.richText.map(pt => pt.text).join('');
                const key = `${advNorm(kodVal)}|${advNorm(odosVal)}`;
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(r);
              }
              for (const rows of groups.values()) {
                if (rows.length < 2) continue;
                const start = rows[0];
                const end = rows[rows.length - 1];
                for (let c = idxKod + 1; c <= idxPlus + 1; c++) {
                  sheet.mergeCells(start, c, end, c);

            applyPraktoreiaVerticalMerges(praktoreiaSheet, praktoreiaHeader);

            // --- ΜΟΝΟ ΠΡΑΚΤΟΡΕΙΑ: Δημιουργία τρίτου φύλλου με όμοια μορφοποίηση ---
            function clonePraktoreiaHeaders(targetSheet) {

              const headerRowClone = targetSheet.addRow(headerRowValues.map(v=>toPlainString(v)));

                if (srcCell.fill) cell.fill = { ...srcCell.fill };
                if (srcCell.border) cell.border = { ...srcCell.border };
              });
            }
            function clonePraktoreiaRow(sourceRow, targetSheet) {
              const newRowVals = sourceRow.values.slice(1);
              const newRow = targetSheet.addRow(newRowVals.map(v=>toPlainString(v)));
              newRow.height = 25;

                if (srcCell.alignment) cell.alignment = { ...srcCell.alignment };
                if (srcCell.fill) cell.fill = { ...srcCell.fill };
                if (srcCell.border) cell.border = { ...srcCell.border };
              });
            }
            function applyPraktoreiaColumnWidths(sheet) {
              const colCount = sheet.columnCount;
              if (!colCount) return;
              let headerRowIdx = 1;
              const firstRow = sheet.getRow(1);
              let nonEmptyCells = 0;
              for (let c = 1; c <= colCount; c++) {
                const val = firstRow.getCell(c).value;
                if (val != null && String(val).trim() !== '') nonEmptyCells++;
              }
              if (nonEmptyCells === 1) headerRowIdx = 2;
              const headerRow = sheet.getRow(headerRowIdx);
              for (let c = 1; c <= colCount; c++) {
                const headerNorm = advNorm(headerRow.getCell(c).value || '');
                let maxLen = 0;
                for (let r = 1; r <= sheet.rowCount; r++) {
                  let val = sheet.getRow(r).getCell(c).value;
                  if (val == null) val = '';
                  if (typeof val === 'object' && val.richText) val = val.richText.map(pt => pt.text).join('');
                  val = String(val);
                  if (val.length > maxLen) maxLen = val.length;
                }
                const bestFit = Math.ceil(maxLen * 1.15 + 2);
                if (headerNorm.includes('συνεργατης')) {
                  sheet.getColumn(c).width = Math.min(30, Math.max(8, bestFit));
                } else {
                  sheet.getColumn(c).width = Math.max(8, Math.min(60, bestFit));
                }
              }
            }
            function applyAlternateRowFillByGroup(sheet, headerValues, colorA = 'FFFFFFFF', colorB = 'FFE1E1E1') {
              // Fill by merged group: all rows in a merged block get the same color, alternate per group
              const rowCount = sheet.rowCount;
              const colCount = sheet.columnCount;
              if (!rowCount || !colCount) return;
              let headerRowIdx = 1;
              const firstRow = sheet.getRow(1);
              let nonEmptyCells = 0;
              for (let c = 1; c <= colCount; c++) {

              if (nonEmptyCells === 1) headerRowIdx = 2;
              const startRow = headerRowIdx + 1;
              if (startRow > rowCount) return;
              // Find group columns
              const advNorm = v => (v||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '').toLowerCase();
              const headerNorms = headerValues.map(advNorm);
              const idxKod = headerNorms.findIndex(x => x === 'κωδ.πελατη');
              const idxOdos = headerNorms.findIndex(x => x.includes('οδο'));
              if (idxKod === -1 || idxOdos === -1) return;
              // Build groups: key = Κωδ. Πελάτη + Οδός, value = [row numbers]
              const groups = [];
              const groupMap = new Map();
              for (let r = startRow; r <= rowCount; r++) {
                const row = sheet.getRow(r);
                let kodVal = row.getCell(idxKod + 1).value;
                let odosVal = row.getCell(idxOdos + 1).value;
                if (kodVal && typeof kodVal === 'object' && kodVal.richText) kodVal = kodVal.richText.map(pt => pt.text).join('');
                if (odosVal && typeof odosVal === 'object' && odosVal.richText) odosVal = odosVal.richText.map(pt => pt.text).join('');
                const key = `${advNorm(kodVal)}|${advNorm(odosVal)}`;
                if (!groupMap.has(key)) groupMap.set(key, []);
                groupMap.get(key).push(r);
              }
              for (const rows of groupMap.values()) {
                groups.push(rows);
              }
              // Apply fill per group
              let colorToggle = true; // true=white, false=gray
              for (const rows of groups) {
                const fillColor = colorToggle ? colorA : colorB;
                colorToggle = !colorToggle;
                for (const r of rows) {
                  const row = sheet.getRow(r);
                  for (let c = 1; c <= colCount; c++) {
                    const cell = row.getCell(c);
                    cell.fill = {
                      type: 'pattern',
                      pattern: 'solid',
                      fgColor: { argb: fillColor },
                      bgColor: { argb: fillColor }
                    };
                  }
                }
              }
            }
            function applyPraktoreiaSheetStyling(sheet) {
              (function applyDataCellBorders(sheet) {
                const colCount = sheet.columnCount;
                const rowCount = sheet.rowCount;
                for (let r = 2; r <= rowCount; r++) {

                    if (r === dataEnd)   border.bottom = { style: 'medium', color: { argb: 'FF000000' } };
                    if (c === 1)         border.left = { style: 'medium', color: { argb: 'FF000000' } };
                    if (c === colCount)  border.right = { style: 'medium', color: { argb: 'FF000000' } };
                    cell.border = border;

                  if (val === '+') colPlus = c;

                for (let r = headerRowIdx + 1; r <= sheet.rowCount; r++) {
                  const row = sheet.getRow(r);
                  for (let c = 1; c <= colCount; c++) {
                    const cell = row.getCell(c);
                    if (c === colA || c === colPsi) {
                      cell.border = { ...cell.border, left: { style: 'double', color: { argb: 'FF000000' } } };
                    }
                    if (c === colPlus) {
                      cell.border = { ...cell.border, right: { style: 'double', color: { argb: 'FF000000' } } };
                    }
                  }
                }
              }
              applyDoubleBorders(sheet);
              sheet.getColumn(1).hidden = true;
              // Όλα τα κελιά του φύλλου ως text format
              for (let r = 1; r <= sheet.rowCount; r++) {
                const row = sheet.getRow(r);
                for (let c = 1; c <= sheet.columnCount; c++) {
                  const cell = row.getCell(c);
                  cell.numFmt = '@';

            const onlyPraktoreiaSheet = wb.addWorksheet('Μόνο Πρακτορεία');
            Object.assign(onlyPraktoreiaSheet.pageSetup, {

              }

    btnClear.addEventListener('click', () => {
      state.files.master = null;
      state.files.info = null;
      state.context.workbookMaster = null;
      state.context.workbookInfo = null;
      state.context.processedMaster = null;
      window._lastPraktoreiaTempSheet = null;
      window._lastPraktoreiaTempSheet2 = null;
      window._lastPraktoreiaTempSheet3 = null;
      masterInput.value = '';
      infoInput.value = '';
      clearBoxUI(masterDrop);
      clearBoxUI(infoDrop);
      previewFinal.innerHTML = `<p class="note">Καθαρίστηκε η κατάσταση.</p>`;
    });

    document.addEventListener('change', (e) => {
      if (e.target && e.target.id === 'masterSheetSelect') {
        renderSelectedMasterFinal();
      }
    });

    function scrollContainer(container, deltaPx) {
      if (!container) return;
      container.scrollBy({ left: deltaPx, behavior: SCROLL_SMOOTH ? 'smooth' : 'auto' });
    }

    previewFinal.addEventListener('keydown', (ev) => {
      if (ev.key === 'ArrowLeft') { ev.preventDefault(); scrollContainer(previewFinal, -200); }
      if (ev.key === 'ArrowRight') { ev.preventDefault(); scrollContainer(previewFinal, 200); }
    });

    function updateScrollButtons(container, leftBtn, rightBtn) {
      if (!container) return;
      const atLeft = container.scrollLeft <= 0;
      const atRight = Math.ceil(container.scrollLeft + container.clientWidth) >= container.scrollWidth;
      leftBtn.style.display = atLeft ? 'none' : 'flex';
      rightBtn.style.display = atRight ? 'none' : 'flex';
    }

    function wireScrollVisibility(container, leftBtn, rightBtn) {
      updateScrollButtons(container, leftBtn, rightBtn);
      container.addEventListener('scroll', () => updateScrollButtons(container, leftBtn, rightBtn));
      const ro = new ResizeObserver(() => updateScrollButtons(container, leftBtn, rightBtn));
      ro.observe(container);
      const mo = new MutationObserver(() => updateScrollButtons(container, leftBtn, rightBtn));
      mo.observe(container, { childList: true, subtree: true });
    }

    // wireScrollVisibility(previewFinal, finalScrollLeft, finalScrollRight);

    clearBoxUI(masterDrop);
    clearBoxUI(infoDrop);
    // === FIXED SCROLL BUTTONS (window overlay, always aligned with preview/table) ===
  (function() {
    // Δημιουργία κουμπιών αν δεν υπάρχουν
    let leftBtn = document.getElementById('fixedScrollLeft');
    let rightBtn = document.getElementById('fixedScrollRight');
    if (!leftBtn) {
      leftBtn = document.createElement('div');
      leftBtn.id = 'fixedScrollLeft';
      leftBtn.className = 'scroll-btn scroll-left';
      leftBtn.title = 'Scroll Left';
      leftBtn.textContent = '◀';
      leftBtn.style.position = 'fixed';
      leftBtn.style.zIndex = '10000';
      leftBtn.style.display = 'none';
      document.body.appendChild(leftBtn);
    }
    if (!rightBtn) {
      rightBtn = document.createElement('div');
      rightBtn.id = 'fixedScrollRight';
      rightBtn.className = 'scroll-btn scroll-right';
      rightBtn.title = 'Scroll Right';
      rightBtn.textContent = '▶';
      rightBtn.style.position = 'fixed';
      rightBtn.style.zIndex = '10000';
      rightBtn.style.display = 'none';
      document.body.appendChild(rightBtn);
    }
    window.updateBtnPositions = function updateBtnPositions() {
      const preview = document.getElementById('previewFinal');
      const sheetTitle = document.querySelector('.sheet-title');
      if (!preview || !sheetTitle) return;
      const previewRect = preview.getBoundingClientRect();
      const titleRect = sheetTitle.getBoundingClientRect();
      // Top: ίδια ευθεία με sheet-title
      const top = titleRect.top + window.scrollY;
      // Left: αριστερό άκρο του preview
      leftBtn.style.top = (top) + 'px';
      leftBtn.style.left = (previewRect.left - 8) + 'px';
      // Right: δεξί άκρο του preview (πάνω από το ορατό scroll area)
      rightBtn.style.top = (top) + 'px';
      rightBtn.style.left = (previewRect.right - rightBtn.offsetWidth + 8) + 'px';
      // Εμφάνιση/κρύψιμο ανάλογα με το scroll
      const atLeft = preview.scrollLeft <= 0;
      const atRight = Math.ceil(preview.scrollLeft + preview.clientWidth) >= preview.scrollWidth;
      leftBtn.style.display = atLeft ? 'none' : 'flex';
      rightBtn.style.display = atRight ? 'none' : 'flex';
    };
    // Scroll actions
    leftBtn.onclick = function(e) {
      e.stopPropagation();
      const preview = document.getElementById('previewFinal');
      preview.scrollBy({ left: -SCROLL_STEP_PX, behavior: SCROLL_SMOOTH ? 'smooth' : 'auto' });
      setTimeout(window.updateBtnPositions, 350);
    };
    rightBtn.onclick = function(e) {
      e.stopPropagation();
      const preview = document.getElementById('previewFinal');
      preview.scrollBy({ left: SCROLL_STEP_PX, behavior: SCROLL_SMOOTH ? 'smooth' : 'auto' });
      setTimeout(window.updateBtnPositions, 350);
    };
    // Ενημέρωση θέσης σε scroll/resize
    window.addEventListener('resize', window.updateBtnPositions);
    window.addEventListener('scroll', window.updateBtnPositions);
    document.getElementById('previewFinal').addEventListener('scroll', window.updateBtnPositions);
    // Ενημέρωση μετά από render
    setTimeout(window.updateBtnPositions, 800);
    setTimeout(window.updateBtnPositions, 0);
  })();
  </script>
</body>
</html>
